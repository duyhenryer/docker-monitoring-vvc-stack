groups:
  - name: log-rules
    type: vlogs
    interval: 1m
    rules:
      # Recording rule: Count logs by path (for debugging and reuse)
      # This creates a metric that can be queried in Grafana
      - record: logCount
        expr: '_time: 1m | stats by (path) count () as total'
        labels:
          metric_type: log_count
        annotations:
          description: "path {{$labels.path}} generated {{$value}} logs in the last 1 minute"
      
      # Alert: Too many logs from a single path
      # Test query: _time: 1m | stats by (path) count () as total | filter total:>50
      # Expected: Should only return paths with >50 logs in last 1 minute
      - alert: tooManyLogs
        expr: '_time: 1m | stats by (path) count () as total | filter total:>50'
        # Add 'for' clause to prevent alert from firing immediately
        # Alert will only fire if condition is true for at least 2 minutes
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Too many logs from path {{$labels.path}}"
          description: "Path {{$labels.path}} generated {{$value}} log entries in the last 1 minute (threshold: 50). This may indicate log spam or an issue."

  - name: vlogs-metrics
    interval: 30s
    rules:
      - alert: DiskRunsOutOfSpace
        expr: |
          sum(vl_data_size_bytes) by(job, instance) /
          (
           sum(vl_free_disk_space_bytes) by(job, instance) +
           sum(vl_data_size_bytes) by(job, instance)
          ) > 0.8
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} (job={{ $labels.job }}) will run out of disk space soon"
          description: "Disk utilisation on instance {{ $labels.instance }} is more than 80%.\n
            Having less than 20% of free disk space could cripple merge processes and overall performance.
            Consider to limit the ingestion rate, decrease retention or scale the disk space if possible."

      - alert: RequestErrorsToAPI
        expr: increase(vl_http_errors_total[5m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Too many errors served for path {{ $labels.path }} (instance {{ $labels.instance }})"
          description: "Requests to path {{ $labels.path }} are receiving errors.
            Please verify if clients are sending correct requests."

      - alert: RowsRejectedOnIngestion
        expr: rate(vl_rows_dropped_total[5m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Some rows are rejected on \"{{ $labels.instance }}\" on ingestion attempt"
          description: "VictoriaLogs is rejecting to ingest rows on \"{{ $labels.instance }}\" due to the
            following reason: \"{{ $labels.reason }}\""